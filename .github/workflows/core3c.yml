name: CORE-3C storage validation test

on:
  push:
    branches: [core3c-storage-validation]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: .
          command: idf.py build

      - name: Verify CORE-3C storage contract
        run: |
          grep -q 'prisma_image_ab_verify' main/image_ab.c
          grep -q 'prisma_video_ab_verify' main/video_ab.c
          grep -q 'readback verify failed' main/image_ab.c
          grep -q 'readback verify failed' main/video_ab.c
          grep -q 'Recovered IMAGE from older committed generation' main/image_ab.c
          grep -q 'Recovered VIDEO from older committed generation' main/video_ab.c
          grep -q '"/api/v1/admin/storage/verify"' main/storage_verify_api.c
          grep -q 'prisma_storage_verify_register_routes' main/api_core3a.c
          grep -q 'PRISMA_ADMIN_USERNAME "Prisma-P"' main/admin_auth.h
          grep -q 'video_a,  data, 0x42,    0x820000,  0x300000' partitions.csv
          grep -q 'video_b,  data, 0x43,    0xB20000,  0x300000' partitions.csv

      - name: Create deterministic 16 MB factory
        run: |
          python3 tools/make_core3c_factory.py
          test "$(stat -c%s dist/PRISMA-PI-PEDAL-CORE3C-16MB.bin)" -eq 16777216
          sha256sum dist/PRISMA-PI-PEDAL-CORE3C-16MB.bin > dist/PRISMA-PI-PEDAL-CORE3C-16MB.sha256

      - name: Upload CORE-3C
        uses: actions/upload-artifact@v4
        with:
          name: prisma-pi-pedal-core3c
          if-no-files-found: error
          path: |
            dist/PRISMA-PI-PEDAL-CORE3C-16MB.bin
            dist/PRISMA-PI-PEDAL-CORE3C-16MB.sha256
            build/prisma_pi_pedal_core3c.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/storage.bin
