name: CORE-4E adaptive resolution processing

on:
  push:
    branches: [core4e-adaptive-resolution]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: .
          command: idf.py build

      - name: Verify CORE-4E contract
        run: |
          grep -Fq 'CONFIG_SPIRAM=y' sdkconfig
          grep -Fq 'CONFIG_SPIRAM_MODE_OCT=y' sdkconfig
          grep -Fq 'PROCESS_TARGET_LONG_SIDE 800u' main/local_process.c
          grep -Fq 'VIDEO_TARGET_LONG_SIDE 640u' main/video_process.c
          grep -Fq 'g_capacity_pixels' main/video_process.c
          grep -Fq 'poster_index' main/video_process.c
          grep -Fq 'prisma_video_process_send_indexed' main/video_process.c
          grep -Fq '/api/v1/process/test/video/frame.idx' main/video_process_api.c
          grep -Fq 'POSTER64-INDEX8' main/video_process.c
          grep -Fq 'adaptVideo' main/web/process.html
          grep -Fq 'video_a,  data, 0x42,    0x820000,  0x300000' partitions.csv
          grep -Fq 'video_b,  data, 0x43,    0xB20000,  0x300000' partitions.csv

      - name: Create deterministic 16 MB factory
        run: |
          python3 tools/make_core4e_factory.py
          test "$(stat -c%s dist/PRISMA-PI-PEDAL-CORE4E-16MB.bin)" -eq 16777216
          sha256sum dist/PRISMA-PI-PEDAL-CORE4E-16MB.bin > dist/PRISMA-PI-PEDAL-CORE4E-16MB.sha256
          sha256sum build/prisma_pi_pedal_core4e.bin > dist/PRISMA-PI-PEDAL-CORE4E-app.sha256

      - name: Upload CORE-4E
        uses: actions/upload-artifact@v4
        with:
          name: prisma-pi-pedal-core4e
          if-no-files-found: error
          path: |
            dist/PRISMA-PI-PEDAL-CORE4E-16MB.bin
            dist/PRISMA-PI-PEDAL-CORE4E-16MB.sha256
            dist/PRISMA-PI-PEDAL-CORE4E-app.sha256
            build/prisma_pi_pedal_core4e.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/storage.bin
