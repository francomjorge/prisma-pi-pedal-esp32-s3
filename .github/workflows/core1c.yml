name: CORE-1C IMAGE API test

on:
  push:
    branches: [core1c-image-api]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: .
          command: idf.py build

      - name: Verify IMAGE API contract
        run: |
          grep -q '"/api/v1/image/info"' main/wifi_portal.c
          grep -q '"/api/v1/image"' main/wifi_portal.c
          grep -q 'HTTP_PUT' main/wifi_portal.c
          grep -q 'HTTP_DELETE' main/wifi_portal.c
          grep -q 'PRISMA_IMAGE_MAX_BYTES' main/wifi_portal.c
          grep -q 'prisma_image_ab_abort' main/wifi_portal.c
          grep -q 'first0 != 0xFF' main/wifi_portal.c
          grep -q 'last1 != 0xD9' main/wifi_portal.c

      - name: Create deterministic 16 MB factory
        run: |
          python3 tools/make_core1c_factory.py
          test "$(stat -c%s dist/PRISMA-PI-PEDAL-CORE1C-16MB.bin)" -eq 16777216
          sha256sum dist/PRISMA-PI-PEDAL-CORE1C-16MB.bin > dist/PRISMA-PI-PEDAL-CORE1C-16MB.sha256

      - name: Upload CORE-1C
        uses: actions/upload-artifact@v4
        with:
          name: prisma-pi-pedal-core1c
          if-no-files-found: error
          path: |
            dist/PRISMA-PI-PEDAL-CORE1C-16MB.bin
            dist/PRISMA-PI-PEDAL-CORE1C-16MB.sha256
            build/prisma_pi_pedal_core1c.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/storage.bin
